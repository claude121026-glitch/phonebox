<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Chess Championship Live</title>
<style>html,body{background:#15171b!important}</style>
</head>
<body>
<style>
:root{
  --bg:#15171b;--panel:#1f2228;--fg:#eceae4;--muted:#9a9ea8;--line:#2e3239;
  --light:#cdbf9f;--dark:#7a5f40;--hl:rgba(230,190,40,.6);--accent:#5fbf8c;--bad:#e2685f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%!important;overflow:hidden!important}
body{background:transparent;color:var(--fg);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:6px}
.wrap{height:100%;display:flex;flex-direction:column;gap:6px;min-height:0}
#side{display:contents}
header{order:1;display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
h1{font-size:14px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:11px;white-space:nowrap}
.live{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--accent);flex:none}
.live i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.25}}
.row{order:2;display:flex;gap:4px;min-width:0}
select,button{font:inherit;font-size:12px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-width:0}
.row select{flex:1}
button{flex:none;cursor:pointer}
#msg{order:3}
#view{order:4;display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.status{order:5;display:flex;justify-content:space-between;gap:6px;color:var(--muted);font-size:11px}
.moves{order:6;flex:1;min-height:28px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px;overflow:auto;font-variant-numeric:tabular-nums;font-size:12px;word-spacing:2px}
.player{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px;width:100%}
.player .n{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player .n small{color:var(--muted);font-weight:400;margin-left:4px}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;padding:1px 6px;border-radius:5px;flex:none}
.clock.run{background:var(--fg);color:var(--bg)}
.boardrow{display:flex;gap:4px;align-items:stretch}
.evalbar{position:relative;width:14px;flex:none;border-radius:4px;overflow:hidden;background:#3a3d44;border:1px solid var(--line)}
.evalbar .w{position:absolute;left:0;right:0;bottom:0;height:50%;background:#f1efe9;transition:height .6s ease}
.evalbar.flip .w{top:0;bottom:auto}
.evalbar .mid{position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(230,80,60,.7);z-index:1}
.evalbar.stale{opacity:.45}
.evaltxt{font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:4px;overflow:hidden;user-select:none}
.sq{position:relative;display:flex;align-items:center;justify-content:center;line-height:1;overflow:hidden}
.sq.l{background:var(--light)}.sq.d{background:var(--dark)}
.sq.h::after{content:"";position:absolute;inset:0;background:var(--hl)}
.sq span{position:relative;z-index:1}
.pw{color:#fff;text-shadow:0 0 2px #000,0 0 1px #000}
.pb{color:#111;text-shadow:0 0 1px rgba(255,255,255,.6)}
.coord{position:absolute;font-size:8px;color:rgba(0,0,0,.55);z-index:1}
.coord.f{right:1px;bottom:0}.coord.r{left:1px;top:0}
.result{font-weight:700;color:var(--fg)}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px;font-size:12px}
.msg.err{border-color:var(--bad)}
[hidden]{display:none!important}
/* Landscape: board on the left, everything else on the right */
body.land .wrap{flex-direction:row;align-items:stretch}
body.land #side{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;min-height:0}
body.land #view{order:0;justify-content:center}
</style>
<div class="wrap">
  <div id="view">
    <div class="player" id="top"><span class="n"></span><span class="clock"></span></div>
    <div class="boardrow">
      <div class="evalbar stale" id="evalbar" title="Engine evaluation (Lichess cloud)"><div class="mid"></div><div class="w" id="evalw"></div></div>
      <div class="board" id="board"></div>
    </div>
    <div class="player" id="bottom"><span class="n"></span><span class="clock"></span></div>
  </div>
  <div id="side">
    <header>
      <div style="min-width:0"><h1 id="title">World Chess Championship</h1><div class="sub" id="round">Finding the live broadcast...</div></div>
      <span class="live" id="live" hidden><i></i>LIVE</span>
    </header>
    <div class="row">
      <select id="event" aria-label="Event"></select>
      <select id="roundSel" aria-label="Round"></select>
      <select id="gameSel" aria-label="Game"></select>
      <button id="flip" type="button" aria-label="Flip board">&#8645;</button>
    </div>
    <div id="msg" class="msg" hidden></div>
    <div class="status"><span><span id="state"></span> <span class="evaltxt" id="evaltxt"></span></span><span id="updated"></span></div>
    <div class="moves" id="moves">Moves will appear here.</div>
  </div>
</div>
<script>
(() => {
  const API = "https://lichess.org/api";
  const POLL_MS = 10000;
  const GLYPH = {k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"};
  const $ = id => document.getElementById(id);
  const st = { tours: [], tourId: null, roundId: null, gameId: null, flipped: false, data: null, fetchedAt: 0, timer: null };
  try { st.flipped = localStorage.getItem("cl_flip") === "1"; } catch (e) {}

  // ---------- fit everything on one screen ----------
  function h(el) { if (!el || el.hidden) return 0; const r = el.getBoundingClientRect(); return r.height; }
  function fit() {
    const W = window.innerWidth, H = window.innerHeight, pad = 12, gap = 6, bar = 18;
    const land = W > H * 1.15;
    document.body.classList.toggle("land", land);
    const players = h($("top")) + h($("bottom")) + 8;
    let size;
    if (land) {
      size = Math.min(H - pad - players, (W - pad) * 0.62 - bar);
    } else {
      const other = h(document.querySelector("header")) + h(document.querySelector(".row")) + h($("msg")) +
                    h(document.querySelector(".status")) + 28 /* moves min */ + gap * 5;
      size = Math.min(W - pad - bar, H - pad - players - other);
    }
    size = Math.max(120, Math.floor(size / 8) * 8);
    const b = $("board");
    b.style.width = b.style.height = size + "px";
    b.style.fontSize = Math.floor(size / 8 * 0.78) + "px";
    $("top").style.width = $("bottom").style.width = (size + bar) + "px";
  }
  window.addEventListener("resize", fit);

  async function getJSON(url) {
    const r = await fetch(url, { headers: { Accept: "application/json" } });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }
  async function getText(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  }
  function showMsg(text, err) { const m = $("msg"); m.textContent = text; m.className = "msg" + (err ? " err" : ""); const was = m.hidden; m.hidden = !text; if (was !== m.hidden) fit(); }
  function opt(sel, value, label, selected) { const o = document.createElement("option"); o.value = value; o.textContent = label; if (selected) o.selected = true; sel.appendChild(o); }

  async function loadEvents() {
    const top = await getJSON(API + "/broadcast/top?page=1");
    const list = [...(top.active || []), ...(top.upcoming || [])];
    const past = (top.past && top.past.currentPageResults) || [];
    st.tours = [...list, ...past].filter(b => b && b.tour);
    const sel = $("event"); sel.innerHTML = "";
    const want = /world\s*(chess\s*)?championship|gukesh|sindarov/i;
    const pick = st.tours.find(b => want.test(b.tour.name)) || st.tours[0];
    st.tours.forEach(b => opt(sel, b.tour.id, b.tour.name, b === pick));
    if (!pick) throw new Error("No broadcasts found.");
    await selectTour(pick.tour.id);
  }
  async function selectTour(id) {
    st.tourId = id;
    const t = await getJSON(API + "/broadcast/" + id);
    $("title").textContent = t.tour.name;
    const sel = $("roundSel"); sel.innerHTML = "";
    const rounds = t.rounds || [];
    const cur = rounds.find(r => r.ongoing) || rounds.find(r => r.id === t.defaultRoundId) ||
      [...rounds].reverse().find(r => r.finished) || rounds[0];
    rounds.forEach(r => opt(sel, r.id, r.name + (r.ongoing ? " • live" : ""), r === cur));
    if (cur) await selectRound(cur.id);
  }
  async function selectRound(id) { st.roundId = id; st.gameId = null; startStream(id); await refresh(true); }

  // ---------- live stream: Lichess pushes PGN the moment a move is played ----------
  // Each push just triggers an immediate refresh; slow polling stays on as a fallback.
  function kick() { clearTimeout(st.kickT); st.kickT = setTimeout(() => refresh(false), 400); }
  async function startStream(roundId) {
    if (st.ctl) st.ctl.abort();
    const ctl = new AbortController(); st.ctl = ctl; st.streaming = false;
    let wait = 15000;
    try {
      const r = await fetch(API + "/stream/broadcast/round/" + roundId + ".pgn", { signal: ctl.signal });
      if (r.status === 429) wait = 60000;
      else if (r.ok && r.body) {
        st.streaming = true;
        const reader = r.body.getReader();
        for (;;) { const x = await reader.read(); if (x.done) break; if (x.value && x.value.length) kick(); }
      }
    } catch (e) { /* network drop or abort */ }
    st.streaming = false;
    if (!ctl.signal.aborted && st.roundId === roundId) setTimeout(() => { if (st.ctl === ctl) startStream(roundId); }, wait);
  }

  async function refresh(rebuildGames) {
    clearTimeout(st.timer);
    try {
      const d = await getJSON(API + "/broadcast/-/-/" + st.roundId);
      st.data = d; st.fetchedAt = Date.now();
      const games = d.games || [];
      if (rebuildGames || !games.some(g => g.id === st.gameId)) {
        const sel = $("gameSel"); sel.innerHTML = "";
        if (!st.gameId || !games.some(g => g.id === st.gameId)) st.gameId = (games.find(g => g.status === "*") || games[0] || {}).id;
        games.forEach(g => opt(sel, g.id, gameLabel(g), g.id === st.gameId));
        $("gameSel").hidden = games.length < 2;
      }
      $("round").textContent = (d.round && d.round.name) || "";
      $("live").hidden = !(d.round && d.round.ongoing);
      showMsg(games.length ? "" : "This round has no games yet.");
      render();
      loadMoves();
    } catch (e) {
      const limited = /429/.test(e.message);
      showMsg(limited ? "Lichess asked us to slow down. Trying again in a minute..." : "Couldn't reach Lichess (" + e.message + "). Retrying...", true);
      st.timer = setTimeout(() => refresh(false), limited ? 60000 : POLL_MS);
      return;
    }
    st.timer = setTimeout(() => refresh(false), st.streaming ? 30000 : POLL_MS);
  }
  function gameLabel(g) {
    const p = g.players || [];
    return (p[0] ? p[0].name : "?") + " – " + (p[1] ? p[1].name : "?") + (g.status && g.status !== "*" ? " (" + g.status + ")" : "");
  }
  function currentGame() { return st.data && (st.data.games || []).find(g => g.id === st.gameId); }

  function render() {
    const g = currentGame(); if (!g) return;
    const fen = g.fen || "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w - - 0 1";
    const parts = fen.split(" "), placement = parts[0], turn = parts[1];
    drawBoard(placement, g.lastMove);
    const white = (g.players || [])[0], black = (g.players || [])[1];
    const ongoing = g.status === "*";
    drawEval();
    if (ongoing && g.fen) loadEval(g.fen);
    fillPlayer($("top"), st.flipped ? white : black, ongoing && turn === (st.flipped ? "w" : "b"), g.thinkTime);
    fillPlayer($("bottom"), st.flipped ? black : white, ongoing && turn === (st.flipped ? "b" : "w"), g.thinkTime);
    $("state").innerHTML = "";
    const s = document.createElement("span");
    if (ongoing) s.textContent = (turn === "w" ? "White" : "Black") + " to move";
    else { s.className = "result"; s.textContent = "Result: " + g.status; }
    $("state").appendChild(s);
    $("updated").textContent = (st.streaming ? "⚡ live" : "Lichess") + " · " +new Date(st.fetchedAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }
  // ---------- evaluation bar (Lichess cloud eval, white's point of view) ----------
  const ev = { fen: null, cp: null, mate: null, known: false, busy: false, until: 0 };
  async function loadEval(fen) {
    if (fen === ev.fen || ev.busy || Date.now() < ev.until) return;
    ev.busy = true;
    try {
      const r = await fetch(API + "/cloud-eval?fen=" + encodeURIComponent(fen));
      if (r.status === 429) { ev.until = Date.now() + 60000; return; }
      ev.fen = fen;
      if (!r.ok) { ev.known = false; return; }          // 404: position not analysed yet
      const pv = ((await r.json()).pvs || [])[0] || {};
      ev.cp = typeof pv.cp === "number" ? pv.cp : null;
      ev.mate = typeof pv.mate === "number" ? pv.mate : null;
      ev.known = ev.cp != null || ev.mate != null;
    } catch (e) { /* the bar is optional */ }
    finally { ev.busy = false; drawEval(); }
  }
  function drawEval() {
    const g = currentGame(), bar = $("evalbar"), w = $("evalw"), t = $("evaltxt");
    bar.classList.toggle("flip", st.flipped);
    let pct = null, txt = "";
    if (g && g.status && g.status !== "*") {
      pct = g.status === "1-0" ? 100 : g.status === "0-1" ? 0 : 50;
    } else if (g && ev.known && ev.fen === g.fen) {
      if (ev.mate != null) { pct = ev.mate > 0 ? 100 : 0; txt = (ev.mate > 0 ? "+" : "-") + "M" + Math.abs(ev.mate); }
      else { const cp = Math.max(-1500, Math.min(1500, ev.cp)); pct = 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * cp)) - 1); txt = (ev.cp > 0 ? "+" : "") + (ev.cp / 100).toFixed(1); }
    }
    bar.classList.toggle("stale", pct == null);
    if (pct != null) w.style.height = pct.toFixed(1) + "%";
    t.textContent = txt ? "· " + txt : "";
  }

  function fillPlayer(el, p, running, thinkTime) {
    const n = el.querySelector(".n"), c = el.querySelector(".clock");
    n.textContent = p ? ((p.title ? p.title + " " : "") + p.name) : "—";
    if (p && p.rating) { const sm = document.createElement("small"); sm.textContent = p.rating; n.appendChild(sm); }
    // Lichess gives the clock as it was at the last move (centiseconds) and thinkTime = seconds
    // the side to move has spent since then, so the live clock = clock - thinkTime - time since fetch.
    let cs = p && typeof p.clock === "number" ? p.clock : null;
    if (cs != null && running) cs = Math.max(0, cs - (typeof thinkTime === "number" ? thinkTime * 100 : 0) - Math.floor((Date.now() - st.fetchedAt) / 10));
    c.textContent = cs == null ? "" : fmtClock(cs);
    c.className = "clock" + (running ? " run" : "");
  }
  function fmtClock(cs) {
    const s = Math.floor(cs / 100), hh = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    const pad = x => String(x).padStart(2, "0");
    return hh ? hh + ":" + pad(m) + ":" + pad(sec) : m + ":" + pad(sec);
  }
  function drawBoard(placement, lastMove) {
    const grid = placement.split("/").map(r => { const row = []; for (const ch of r) { if (/\d/.test(ch)) for (let i = 0; i < +ch; i++) row.push(null); else row.push(ch); } return row; });
    const hl = new Set();
    if (lastMove && lastMove.length >= 4) { hl.add(lastMove.slice(0, 2)); hl.add(lastMove.slice(2, 4)); }
    const b = $("board"); b.innerHTML = "";
    for (let vr = 0; vr < 8; vr++) for (let vf = 0; vf < 8; vf++) {
      const r = st.flipped ? 7 - vr : vr, f = st.flipped ? 7 - vf : vf;
      const sqName = "abcdefgh"[f] + (8 - r);
      const d = document.createElement("div");
      d.className = "sq " + ((r + f) % 2 ? "d" : "l") + (hl.has(sqName) ? " h" : "");
      const pc = grid[r] && grid[r][f];
      if (pc) { const s = document.createElement("span"); s.textContent = GLYPH[pc.toLowerCase()]; s.className = pc === pc.toUpperCase() ? "pw" : "pb"; d.appendChild(s); }
      if (vr === 7) { const c = document.createElement("span"); c.className = "coord f"; c.textContent = "abcdefgh"[f]; d.appendChild(c); }
      if (vf === 0) { const c = document.createElement("span"); c.className = "coord r"; c.textContent = 8 - r; d.appendChild(c); }
      b.appendChild(d);
    }
  }

  let lastMovesKey = "";
  async function loadMoves() {
    const g = currentGame(); if (!g) return;
    const key = st.roundId + g.id + (g.fen || "");
    if (key === lastMovesKey) return; lastMovesKey = key;
    try {
      const pgn = await getText(API + "/broadcast/round/" + st.roundId + ".pgn");
      const games = pgn.split(/\n\n(?=\[Event )/);
      const w = (g.players || [])[0], bl = (g.players || [])[1];
      const mine = games.find(t => w && bl && t.includes('[White "' + w.name + '"]') && t.includes('[Black "' + bl.name + '"]')) || (games.length === 1 ? games[0] : null);
      if (!mine) return;
      const body = mine.replace(/^\[.*\]\s*$/gm, "").replace(/\{[^}]*\}/g, "").replace(/\([^)]*\)/g, "").replace(/\$\d+/g, "").replace(/\s+/g, " ").trim();
      $("moves").textContent = body || "No moves yet.";
      $("moves").scrollTop = $("moves").scrollHeight;
    } catch (e) { /* moves are optional */ }
  }

  $("event").addEventListener("change", e => selectTour(e.target.value).catch(err => showMsg("Couldn't load event: " + err.message, true)));
  $("roundSel").addEventListener("change", e => selectRound(e.target.value));
  $("gameSel").addEventListener("change", e => { st.gameId = e.target.value; lastMovesKey = ""; render(); loadMoves(); fit(); });
  $("flip").addEventListener("click", () => { st.flipped = !st.flipped; try { localStorage.setItem("cl_flip", st.flipped ? "1" : "0"); } catch (e) {} render(); });
  setInterval(() => { if (st.data) render(); }, 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && st.roundId) refresh(false); });

  drawBoard("rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR", null);
  fit();
  loadEvents().then(fit).catch(e => showMsg("Couldn't load broadcasts from Lichess (" + e.message + "). Check the internet connection.", true));
})();
</script>
</body>
</html>
